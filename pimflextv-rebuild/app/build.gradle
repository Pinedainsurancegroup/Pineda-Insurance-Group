plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pimflextv.next'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pimflextv.next'
        minSdk 21
        targetSdk 35
        versionCode 12
        versionName '2.1.1'
    }

    def releaseKeystore = System.getenv('PIMFLEX_RELEASE_KEYSTORE')
    def releaseStorePassword = System.getenv('PIMFLEX_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('PIMFLEX_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('PIMFLEX_RELEASE_KEY_PASSWORD')
    def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        if (hasReleaseSigning) {
            production {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Use the standard Android debug key. Production credentials are never used for debug builds.
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.production
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'org.videolan.android:libvlc-all:3.7.6'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:22.0.0'
}
