name: Build TatyNails Android APK

on:
  push:
    branches:
      - tatynails-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Recreate TatyNails project
        run: |
          mkdir -p /tmp/taty
          cat .tatynails_build/part*.b64 > /tmp/tatynails.zip.b64
          base64 -d /tmp/tatynails.zip.b64 > /tmp/tatynails.zip
          unzip -q /tmp/tatynails.zip -d /tmp/taty
          test -f /tmp/taty/TatyNailsAndroid/app/build.gradle

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: /tmp/taty/TatyNailsAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TatyNails-v3-debug-apk
          path: /tmp/taty/TatyNailsAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
