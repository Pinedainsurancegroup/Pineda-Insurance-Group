name: Build TatyNails Android APK

on:
  push:
    branches:
      - tatynails-android-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate TatyNails v3 project
        run: |
          rm -rf /tmp/taty
          mkdir -p /tmp/taty
          cat .tatynails_build/part*.b64 > /tmp/tatynails.zip.b64
          base64 -d /tmp/tatynails.zip.b64 > /tmp/tatynails.zip
          unzip -q /tmp/tatynails.zip -d /tmp/taty
          test -f /tmp/taty/TatyNailsAndroid/app/build.gradle

      - name: Apply TatyNails v4 overlay
        run: |
          cat .tatynails_build/v4part00a.b64 .tatynails_build/v4part00b.b64 .tatynails_build/v4part01a.b64 .tatynails_build/v4part01b.b64 .tatynails_build/v4part02.b64 .tatynails_build/v4part03.b64 > /tmp/tatynails-v4-overlay.zip.b64
          base64 -d /tmp/tatynails-v4-overlay.zip.b64 > /tmp/tatynails-v4-overlay.zip
          unzip -t /tmp/tatynails-v4-overlay.zip
          unzip -q -o /tmp/tatynails-v4-overlay.zip -d /tmp/taty
          grep -q "versionCode 4" /tmp/taty/TatyNailsAndroid/app/build.gradle

      - name: Apply TatyNails v4.1 overlay
        run: |
          cat .tatynails_build/v41part00.b64 .tatynails_build/v41part01.b64 .tatynails_build/v41part02.b64 .tatynails_build/v41part03.b64 > /tmp/tatynails-v41-overlay.zip.b64
          base64 -d /tmp/tatynails-v41-overlay.zip.b64 > /tmp/tatynails-v41-overlay.zip
          unzip -t /tmp/tatynails-v41-overlay.zip
          unzip -q -o /tmp/tatynails-v41-overlay.zip -d /tmp/taty
          grep -q "versionCode 5" /tmp/taty/TatyNailsAndroid/app/build.gradle
          grep -q "versionName '4.1'" /tmp/taty/TatyNailsAndroid/app/build.gradle

      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: /tmp/taty/TatyNailsAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TatyNails-v4.1-debug-apk
          path: /tmp/taty/TatyNailsAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-tools-35-signing
          path: |
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
            /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign
          if-no-files-found: error
