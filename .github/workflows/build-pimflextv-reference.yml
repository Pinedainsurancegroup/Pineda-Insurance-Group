name: PIMFLEX TV Reference Preview

on:
  push:
    branches: [pimflextv-reference-402-20261007]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild stable baseline, then apply UI patch
        working-directory: pimflextv-rebuild
        run: |
          bash apply_release_patches.sh
          cp app/src/main/java/com/pimflextv/next/MainActivity.java "$RUNNER_TEMP/stable.java"
          python3 patch_v32_reference_home.py
          python3 verify_reference_scope.py "$RUNNER_TEMP/stable.java"
      - name: Build side-by-side preview APK and AAB
        working-directory: pimflextv-rebuild
        run: gradle :app:assembleDebug :app:bundleDebug --no-daemon
      - name: Verify preview identity and signature
        run: |
          APK=pimflextv-rebuild/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "name='com.pimflextv.next.reference'"
          sha256sum "$APK" pimflextv-rebuild/app/build/outputs/bundle/debug/app-debug.aab > PREVIEW-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PIMFLEX-TV-3.2.0-reference.1-TEST-ONLY
          path: |
            pimflextv-rebuild/app/build/outputs/apk/debug/app-debug.apk
            pimflextv-rebuild/app/build/outputs/bundle/debug/app-debug.aab
            PREVIEW-SHA256.txt
