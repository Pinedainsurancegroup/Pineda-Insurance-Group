name: PIMFLEX TV Reference Preview

on:
  push:
    branches: [pimflextv-reference-402-20261007]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct and verify validated baseline and backup scope
        working-directory: pimflextv-rebuild
        run: |
          bash apply_release_patches.sh
          cp app/src/main/java/com/pimflextv/next/MainActivity.java "$RUNNER_TEMP/stable.java"
          python3 patch_v32_reference_home.py
          python3 verify_reference_scope.py "$RUNNER_TEMP/stable.java"
          cp app/src/main/java/com/pimflextv/next/MainActivity.java "$RUNNER_TEMP/reference.java"
          cp app/src/main/java/com/pimflextv/next/SecureStore.java "$RUNNER_TEMP/secure.java"
          python3 patch_v321_portable_backup.py
          python3 verify_portable_scope.py "$RUNNER_TEMP/reference.java" "$RUNNER_TEMP/secure.java"
      - name: Test encrypted transfer and non-destructive restore
        working-directory: pimflextv-rebuild
        run: gradle :app:testPreviewUnitTest --no-daemon
      - name: Build isolated preview APK and AAB for private signing
        working-directory: pimflextv-rebuild
        run: gradle :app:assemblePreview :app:bundlePreview --no-daemon
      - name: Verify preview identity
        run: |
          APK=pimflextv-rebuild/app/build/outputs/apk/preview/app-preview-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "name='com.pimflextv.next.preview'"
          sha256sum "$APK" pimflextv-rebuild/app/build/outputs/bundle/preview/app-preview.aab > PREVIEW-UNSIGNED-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PIMFLEX-TV-3.2.1-preview.1-UNSIGNED
          path: |
            pimflextv-rebuild/app/build/outputs/apk/preview/app-preview-unsigned.apk
            pimflextv-rebuild/app/build/outputs/bundle/preview/app-preview.aab
            pimflextv-rebuild/app/build/test-results/testPreviewUnitTest/
            PREVIEW-UNSIGNED-SHA256.txt
