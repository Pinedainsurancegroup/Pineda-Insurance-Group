name: Build PIMFLEX TV Rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - pimflextv-rebuild
    paths:
      - 'pimflextv-rebuild/**'
      - '.github/workflows/build-pimflextv.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pimflextv-rebuild/**'
      - '.github/workflows/build-pimflextv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore QA signing key
        shell: bash
        run: base64 -d pimflextv-rebuild/qa-signing.jks.b64 > pimflextv-rebuild/qa-signing.jks

      - name: Apply app feature patch
        working-directory: pimflextv-rebuild
        run: python3 patch_features.py

      - name: Apply visual interface patch
        working-directory: pimflextv-rebuild
        run: python3 patch_visual.py

      - name: Apply content details and history patch
        working-directory: pimflextv-rebuild
        run: python3 patch_content_core.py

      - name: Apply family controls patch
        working-directory: pimflextv-rebuild
        run: python3 patch_parental.py

      - name: Apply v1.4 settings and Catch-Up patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v14_settings.py

      - name: Apply v1.4 saved accounts patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v14_accounts.py

      - name: Apply v1.5 player tools patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v15.py

      - name: Apply v2 account scoped data patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_scope.py

      - name: Apply v2 global search patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_search.py

      - name: Apply v2 multi-screen patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_multiscreen.py

      - name: Apply v2 extras patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_extras.py

      - name: Apply v2 M3U patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_m3u.py

      - name: Apply v2 live zapping patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_zapping.py

      - name: Apply v2 Now/Next guide patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_guide.py

      - name: Apply v2 Chromecast patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v2_cast.py

      - name: Apply IPTV player patch
        working-directory: pimflextv-rebuild
        run: python3 patch_player.py

      - name: Apply audio and subtitle selector patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v21_tracks.py

      - name: Apply v2.2 clone UI patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v22_clone_ui.py

      - name: Apply v2.2 version patch
        working-directory: pimflextv-rebuild
        run: python3 patch_v22_version.py

      - name: Build release APK and AAB
        working-directory: pimflextv-rebuild
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Rename release artifacts
        run: |
          cp pimflextv-rebuild/app/build/outputs/apk/release/app-release.apk PIMFLEX-TV-v2.2.0.apk
          cp pimflextv-rebuild/app/build/outputs/bundle/release/app-release.aab PIMFLEX-TV-v2.2.0.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PIMFLEX-TV-v2.2.0
          path: |
            PIMFLEX-TV-v2.2.0.apk
            PIMFLEX-TV-v2.2.0.aab
          if-no-files-found: error
