name: Build PIMFLEX TV Rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - pimflextv-rebuild
    paths:
      - 'pimflextv-rebuild/**'
      - '.github/workflows/build-pimflextv.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pimflextv-rebuild/**'
      - '.github/workflows/build-pimflextv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply IPTV player patch
        working-directory: pimflextv-rebuild
        run: python3 patch_player.py

      - name: Build APK
        working-directory: pimflextv-rebuild
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp pimflextv-rebuild/app/build/outputs/apk/debug/app-debug.apk PIMFLEX-TV-PLAYER-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIMFLEX-TV-PLAYER-FIX
          path: PIMFLEX-TV-PLAYER-FIX.apk
          if-no-files-found: error
