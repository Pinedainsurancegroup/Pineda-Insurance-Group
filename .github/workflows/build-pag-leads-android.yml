name: Build PAG Leads Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'pag-leads-android/**'
      - '.github/workflows/build-pag-leads-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: pag-leads-android
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp pag-leads-android/app/build/outputs/apk/debug/app-debug.apk PAG-Leads-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAG-Leads-v1-APK
          path: PAG-Leads-v1.apk
          if-no-files-found: error
