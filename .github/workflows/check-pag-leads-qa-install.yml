name: Check PAG Leads QA installation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-pag-leads-qa-install.yml'

jobs:
  install-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned QA APK
        working-directory: pag-leads-android
        run: gradle :app:assembleDebug :app:assembleQa --no-daemon
      - name: Sign QA with disposable Android debug identity
        run: |
          keytool -genkeypair -noprompt -keystore /tmp/pag-qa-test.jks \
            -storepass android -keypass android -alias qa-debug \
            -dname 'CN=QA Install Test' -keyalg RSA -keysize 2048 -validity 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/pag-qa-test.jks \
            --ks-key-alias qa-debug \
            --ks-pass pass:android --key-pass pass:android \
            --out /tmp/pag-leads-qa-install-check.apk \
            pag-leads-android/app/build/outputs/apk/qa/app-qa-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify /tmp/pag-leads-qa-install-check.apk
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            adb install /tmp/pag-leads-qa-install-check.apk
            adb shell pm path com.pinedaagencygroup.leads.qa
