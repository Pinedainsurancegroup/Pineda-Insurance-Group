name: Test PAG Leads CRM bridge (staging only)
on:
  pull_request:
    paths:
      - 'pag-leads-bridge/**'
      - '.github/workflows/test-pag-leads-bridge.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test pag-leads-bridge/tests/bridge.test.cjs
