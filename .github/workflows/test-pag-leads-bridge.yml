name: Test PAG Leads CRM bridge (staging only)
on:
  pull_request:
    paths:
      - 'pag-leads-bridge/**'
      - '.github/workflows/test-pag-leads-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test pag-leads-bridge/tests/*.test.cjs
