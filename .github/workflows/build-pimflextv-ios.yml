name: PIMFLEX TV iPhone and iPad Preview
on:
  pull_request:
    branches: [pimflextv-production-hardening, pimflextv-ios-20261029]
    paths: ['pimflextv-ios/**', '!pimflextv-ios/**/*.md', '.github/workflows/build-pimflextv-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pimflextv-ios
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests
        run: swift test
      - name: Signing export preflight tests
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/archive-signed.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          bash scripts/prepare-ios.sh
      - name: Build universal simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace PimflexTV.xcworkspace -scheme PimflexTV -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Build unsigned universal iPhone and iPad app
        run: |
          set -o pipefail
          xcodebuild -workspace PimflexTV.xcworkspace -scheme PimflexTV -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO build | tee device-build.log
      - name: Package simulator app and generated source project
        run: |
          ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/PimflexTV.app PIMFLEXTV-iOS-Simulator.zip
          mkdir -p SourcePackage
          cp -R App Sources Tests UITests Resources scripts PimflexTV.xcodeproj Package.swift project.yml Podfile Vendor *.md SourcePackage/
          ditto -c -k --keepParent SourcePackage PIMFLEXTV-iOS-Source.zip
      - name: Upload simulator and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PIMFLEXTV-iPhone-iPad-PREVIEW-NOT-INSTALLER
          path: |
            pimflextv-ios/PIMFLEXTV-iOS-Simulator.zip
            pimflextv-ios/PIMFLEXTV-iOS-Source.zip
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIMFLEXTV-iOS-build-validation
          path: |
            pimflextv-ios/build.log
            pimflextv-ios/device-build.log
  test-ui:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad-compact, ipad-large]
    defaults:
      run:
        working-directory: pimflextv-ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          bash scripts/prepare-ios.sh
      - name: Reference and adaptive layout UI tests
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 scripts/select-simulator.py '${{ matrix.device }}')
          xcodebuild -workspace PimflexTV.xcworkspace -scheme PimflexTV -configuration Debug -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -derivedDataPath DerivedData -resultBundlePath UITests.xcresult CODE_SIGNING_ALLOWED=NO test | tee ui-tests.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path Screenshots
          fi
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIMFLEXTV-UI-${{ matrix.device }}
          path: |
            pimflextv-ios/UITests.xcresult
            pimflextv-ios/ui-tests.log
            pimflextv-ios/Screenshots/
