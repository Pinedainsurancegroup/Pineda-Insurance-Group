name: Test PAG Leads Firestore rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firebase/**'
      - 'pag-leads-private-api/Spark*'
      - '.github/workflows/test-pag-leads-firestore.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - 'pag-leads-private-api/Spark*'
      - '.github/workflows/test-pag-leads-firestore.yml'

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no-cost owner gateway
        run: node --test pag-leads-private-api/SparkOwnerGateway.test.cjs pag-leads-private-api/SparkPushSender.test.cjs pag-leads-private-api/SparkRecruitmentIdentity.test.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: firebase
        run: npm install --no-package-lock --ignore-scripts
      - name: Check role isolation and suspension
        working-directory: firebase
        run: npm run test:rules
      - name: Check owner recruitment gateway
        working-directory: firebase/functions
        run: |
          npm ci --ignore-scripts
          npm test
          node -e 'require("./index.js")'
